name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run build:web

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/worker/requirements.txt
      - name: Install worker dependencies
        run: pip install -r apps/worker/requirements.txt
      - name: Run worker tests
        run: pytest
        working-directory: apps/worker

  migrate:
    runs-on: ubuntu-latest
    # Only run on pushes to main (i.e. after PR merge)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [web]
    env:
      ORAMA_DATABASE_URL: ${{ secrets.ORAMA_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web
      - name: Apply schema to Neon (push)
        # drizzle-kit migrate uses the neon-http driver which cannot execute DDL over HTTP.
        # drizzle-kit push uses the WS driver internally and works correctly against Neon.
        run: npx drizzle-kit push --force
        working-directory: apps/web
