name: Deploy Worker to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push worker to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "jordanbell321@gmail.com"
          git config --global user.name "Jay Bell"

          # Clone the HF Space repo
          git clone https://JayNightmare:${HF_TOKEN}@huggingface.co/spaces/JayNightmare/orama-worker hf-space

          # Sync worker contents (Dockerfile, requirements.txt, app/)
          rsync -av --delete \
            --exclude='.git' \
            --exclude='tests/' \
            --exclude='.env*' \
            apps/worker/ hf-space/

          # Copy the HF Space README as the root README.md
          cp apps/worker/README_HF.md hf-space/README.md

          cd hf-space
          git add -A

          # Only commit and push if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "deploy: sync worker from orama-research-platform@${{ github.sha }}"
            git push
          fi
